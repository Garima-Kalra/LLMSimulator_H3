model:
  model_name: llama3_405B

system:
  gpu_gen: B200 # e.g. A100, H100, B100, B200 (currently only support 4 generation)
  nvlink_gen: 5
  infiniband_gen: 800
  num_node: 4
  num_device: 8
  processor_type: GPU
  use_hbf: on # H3: add High Bandwidth Flash as a second memory tier (weights + shared KV cache)
  hbm_reserve_fraction: 0.0821 # framework/workspace/fragmentation headroom; calibrated to paper Fig.5
  architecture: cascaded
  hbm_sites: 8
  hbf_sites: 0
  hbm_dies_per_site: 8
  hbf_dies_per_site: 8
  shoreline_slots: 8
  hbf_bandwidth_scale: 1.0 # sensitivity knob, e.g. 0.5 for halved HBF bandwidth
  distribution:
    expert_tensor_degree: 32
    none_expert_tensor_degree: 32
    context_parallel_degree: 4 # H3: none_expert_tensor_degree / context_parallel_degree must divide num_kv_heads (8 for llama3_405B)
  optimization:
    parallel_execution: off
    hetero_subbatch: off
    disagg_system: off
    use_low_unit_moe_only: off
    use_ramulator: off
    compressed_kv: on
    use_absorb: on
    use_flash_mla: on
    use_flash_attention: on
    reuse_kv_cache: on
    kv_cache_reuse_rate: 0.0
    prefill_mode: off
    decode_mode: on

serving:
  max_batch_size: 8000
  max_process_token: 0

simulation:
  cag_amortize_shared_compute: true
  data: synthesis
  input_len: 1000
  output_len: 1000
  context_window: 10000000 # CAG: total context length (ISL+OSL+shared pre-computed KV cache); 0 disables CAG shared cache
  precision_byte: 1
  fp8_compute_doubling: on # sensitivity knob: whether FP8/INT8 doubles GPU peak FLOPS (pre-existing, unvalidated-against-H3 convention); off to test the alternative
  kv_cache_precision_byte: 2 # paper's own 540GB/1M-token shared-cache figure only matches FP16 (2B); weights stay FP8 (precision_byte:1)
  skewness: 0.0
  iter: 10
  injection_rate: 0
  exit_out_of_memory: off
  mem_cap_limit: on

log:
  print_log: off
  export_gantt: off
  output_directory: ../data/
  gantt_directory: ./gantt
